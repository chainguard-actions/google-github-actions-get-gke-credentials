name: Test connect gateway with fleet membership name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster_name: my-test-cluster
          location: us-central1
          project_id: my-test-project
          use_connect_gateway: 'true'
          fleet_membership_name: projects/my-test-project/locations/global/memberships/my-membership
      - name: Assert action ran with fleet_membership_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KUBECONFIG_PATH: ${{ steps.action.outputs.kubeconfig_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "kubeconfig_path: $KUBECONFIG_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$KUBECONFIG_PATH" ]; then
              echo "FAIL: action succeeded but kubeconfig_path output is empty"
              exit 1
            fi
            echo "PASS: got kubeconfig_path '$KUBECONFIG_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real GKE cluster available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
