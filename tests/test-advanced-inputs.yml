name: Test advanced inputs - namespace, quota_project_id, fleet_membership_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster_name: my-test-cluster
          location: us-east1
          project_id: my-test-project
          namespace: my-namespace
          quota_project_id: my-quota-project
          fleet_membership_name: projects/my-test-project/locations/global/memberships/my-membership
          use_connect_gateway: 'true'
      - name: Assert action ran (expected to fail without real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without real GCP credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
