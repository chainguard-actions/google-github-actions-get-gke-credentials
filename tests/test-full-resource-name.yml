name: Test full resource name for cluster_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster_name: projects/my-project/locations/us-east1/clusters/my-cluster
      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KUBECONFIG_PATH: ${{ steps.action.outputs.kubeconfig_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "kubeconfig_path: $KUBECONFIG_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$KUBECONFIG_PATH" ]; then
              echo "FAIL: action succeeded but kubeconfig_path output is empty"
              exit 1
            fi
            if [ ! -f "$KUBECONFIG_PATH" ]; then
              echo "FAIL: kubeconfig_path '$KUBECONFIG_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: action succeeded and kubeconfig_path is set to '$KUBECONFIG_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
