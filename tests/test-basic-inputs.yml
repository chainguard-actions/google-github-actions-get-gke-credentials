name: Test basic inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster_name: my-cluster
          location: us-central1
          project_id: my-project
          namespace: default
          context_name: my-context
      - name: Assert action ran (failed due to missing credentials, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no real GCP credentials,
          # not because of missing required inputs. Either 'failure' or 'success'
          # is acceptable here — what matters is the inputs were accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with provided inputs (outcome=$OUTCOME)"
